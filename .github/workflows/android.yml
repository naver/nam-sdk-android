name: 'Assemble samples'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: ${{ github.event.pull_request.title || github.event.head_commit.message }}

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Build with Gradle
      # Retry once so that a transient failure, such as a 429 from Maven Central, does not fail the run
      run: |
        ./gradlew clean assembleDebug || {
          echo "::warning::Gradle build failed, retrying in 60 seconds"
          sleep 60
          ./gradlew assembleDebug
        }
